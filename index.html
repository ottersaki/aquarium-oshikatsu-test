<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#9bd8d7"><link rel="manifest" href="./manifest.json"><link rel="apple-touch-icon" href="./icon-192.png"><title>Sea Glass Diary | 水族館の推し活記録</title>
<style>
:root{--ink:#477982;--muted:#83a5a8;--sea:#78bdc5;--mint:#e3f5f1;--pink:#e5a0b5;--paper:#fffefa}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,'Noto Sans JP',sans-serif;background:radial-gradient(circle at 15% 20%,#ffffff99 0 4px,transparent 5px),radial-gradient(circle at 80% 35%,#ffffff77 0 3px,transparent 4px),linear-gradient(180deg,#e8fbfa,#bfe9ec 60%,#a7dce4);min-height:100vh}header{text-align:center;padding:32px 16px 25px;background:linear-gradient(130deg,#a1d9dd,#7bc8d0);color:white;border-radius:0 0 34px 34px;box-shadow:0 5px 20px #407b8120}header .eyebrow{font-size:11px;letter-spacing:3px}h1{font-size:26px;margin:8px 0}header p{font-size:13px;margin:0 0 12px}main{max-width:650px;margin:auto;padding:16px}.otter{height:190px;overflow:hidden;border-radius:22px;margin:3px 0 16px;box-shadow:0 8px 20px #407b8120}.otter img{width:100%;height:100%;object-fit:cover}.card{position:relative;background:var(--paper);border:1px solid #fff;border-radius:24px;padding:19px;margin:16px 0;box-shadow:0 7px 22px #47798218}.card:before{content:'✦ ｡˚ 🫧 ˚｡ ✦';position:absolute;right:17px;top:8px;color:#9acdd0;font-size:11px}h2{font-size:19px;margin:7px 0 15px}h3{font-size:15px;margin:14px 0 9px}label{display:block;font-weight:650;font-size:13px;margin-top:10px}input,select,textarea{width:100%;border:1px solid #d1e8e8;border-radius:13px;padding:12px;margin:6px 0;background:#fff;font:inherit;font-size:16px;color:#477982}textarea{min-height:85px;resize:vertical}button{border:0;border-radius:14px;padding:12px;font:inherit;font-weight:700;background:#70b9c1;color:white;cursor:pointer}button:disabled{opacity:.5;cursor:not-allowed}button:active{transform:scale(.98)}.wide{width:100%;margin-top:9px}.secondary{background:#e5f5f3;color:#4b8991}.danger{background:#fff0f0;color:#b35f6e}.toolbar{display:flex;align-items:center;gap:9px;margin-bottom:13px}.toolbar button{background:#e3f5f1;color:#4b8991;width:43px;flex:none}.toolbar strong{text-align:center;flex:1}.calendar-paper{background:linear-gradient(180deg,#fff,#fbfffd);border:1px solid #d8ecea;border-radius:20px;padding:12px 9px 15px;position:relative}.calendar-paper:before{content:'🐚';position:absolute;right:10px;top:-19px;font-size:24px;transform:rotate(16deg)}.calendar-grid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}.weekday{text-align:center;color:#7fa4a8;font-size:12px;padding:8px 0}.weekday:first-child{color:#d393a6}.day{min-width:0;width:100%;min-height:55px;padding:5px 1px;border-radius:12px;background:#f4faf9;color:#59868c;border:1px solid transparent;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:2px;font-size:13px}.day.visit{background:#e7f6f6}.day.birthday{background:#fff0f5}.day.both{background:linear-gradient(130deg,#e4f7f6 50%,#fff0f5 50%)}.day.selected{border:2px solid #76b8c1;box-shadow:0 0 0 2px #e1f4f4}.hearts{display:flex;gap:2px;font-size:15px;line-height:1}.heart-sea{color:#7dc2cb}.heart-pink{color:#e2a0b6}.legend{display:flex;justify-content:center;flex-wrap:wrap;gap:12px;color:#719ca0;font-size:12px;margin-top:12px}.record{border-top:1px dashed #d6e8e7;padding:15px 0}.record:first-child{border-top:0}.record .name{font-size:17px;font-weight:800}.small{font-size:13px;color:#789da1}.record img{display:block;width:100%;max-height:320px;object-fit:cover;border-radius:14px;margin-top:10px}.record-actions{display:flex;gap:8px}.record-actions button{flex:1;font-size:13px}.empty{text-align:center;color:#85a4a6;padding:20px 6px}.birthday-item{background:#fff1f5;border-radius:15px;padding:12px;margin:8px 0;color:#aa7287}.birthday-item strong{color:#9e6379}.tape{width:95px;height:20px;background:#b5e1dc9c;transform:rotate(-4deg);margin:-26px auto 13px;position:relative}.modal{position:fixed;inset:0;background:#21484d88;z-index:1000;display:flex;align-items:center;justify-content:center;padding:15px}.modal-panel{background:#fffefa;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px;padding:20px}.modal-actions{display:flex;gap:8px}.modal-actions button{flex:1}.hint{font-size:12px;color:#799da1;line-height:1.6}.status{font-size:12px;color:#fff}.section-heading{display:flex;justify-content:space-between;align-items:center;gap:8px}.section-heading button{font-size:12px;padding:8px 10px}.animal-card{border:1px solid #dceceb;border-radius:15px;padding:12px;margin:8px 0;background:#fafffe}.animal-card .actions{display:flex;gap:8px;margin-top:8px}.animal-card .actions button{flex:1;font-size:12px;padding:9px}.photo-preview{max-width:100%;max-height:220px;object-fit:cover;border-radius:12px}.footnote{text-align:center;color:#6b999f;font-size:11px;margin:20px 0}#loginArea button{background:#ffffffdf;color:#4e8991;margin:5px;padding:10px 16px;font-size:13px}#loginArea #logoutBtn{background:#ffffff55;color:white}@media(max-width:380px){main{padding:10px}.card{padding:14px}.calendar-grid{gap:2px}.day{min-height:49px}}
</style></head>
<body>
<header><div class="eyebrow">MY AQUARIUM MEMORIES ♡</div><h1>🦦 Sea Glass Diary 🐚</h1><p>海の思い出を、かわいい手帳に 🫧</p><div id="loginArea"><button id="loginBtn">Googleでログイン</button><button id="logoutBtn" style="display:none">ログアウト</button><div id="userInfo" class="status"></div></div></header>
<main>
<div class="otter"><img src="./otter-ocean-bg.jpg" alt="海で浮かぶラッコ" onerror="this.parentElement.style.display='none'"></div>
<section class="card"><div class="tape"></div><h2>🐚 海の思い出カレンダー</h2><div class="calendar-paper"><div class="toolbar"><button id="prevMonth" type="button" aria-label="前月">❮</button><strong id="calendarTitle"></strong><button id="nextMonth" type="button" aria-label="翌月">❯</button></div><div id="calendar"></div><div class="legend"><span><span class="heart-sea">♥</span> 訪問日</span><span><span class="heart-pink">♥</span> お誕生日</span></div></div><div id="dayDetails" aria-live="polite"></div><button class="wide secondary" id="showAllRecords">📖 すべての思い出を見る</button></section>
<section class="card"><h2>🎂 推しのプロフィール</h2><p class="hint">お誕生日を登録すると毎年カレンダーにピンクのハートがつくよ。生まれた年が分かれば年齢も自動計算 ♡</p><div id="animalProfiles"></div><button id="addAnimalBtn" class="wide secondary">＋ 推しを登録する</button></section>
<section class="card"><h2>🏝️ 水族館を記録する</h2><form id="recordForm"><input id="aquarium" placeholder="水族館名（例：鳥羽水族館）" required><label for="date">📅 行った日</label><input id="date" type="date"><label for="animalCategory">🐾 動物</label><select id="animalCategory"><option>🦦 ラッコ</option><option>🐧 ペンギン</option><option>🦭 アザラシ</option><option>🦣 セイウチ</option><option>🦫 ビーバー</option><option>🐬 イルカ</option><option>🐋 クジラ</option><option>🦈 サメ</option><option>🐢 カメ</option><option>🐙 タコ</option><option>🐠 魚</option><option>🐾 その他</option></select><input id="otterName" placeholder="個体名（例：メイちゃん、44ちゃん）"><label for="photo">📸 写真</label><input id="photo" type="file" accept="image/*"><input id="photoOtterName" placeholder="この写真の動物（例：メイちゃん）"><textarea id="memo" placeholder="今日の思い出・感想"></textarea><button id="saveRecord" class="wide" type="submit">思い出を記録する 🦦</button></form></section>
<section class="card"><h2>📖 思い出アルバム</h2><div id="records" aria-live="polite"></div><button id="testCloud" class="wide secondary">☁️ クラウドの海をのぞく</button></section>
<p class="footnote">Sea Glass Diary ♡ 大切な海の思い出をいつまでも</p>
</main>
<script>
const $=id=>document.getElementById(id);
let calendarDate=new Date(),selectedDate=null,currentRecords=[],currentAnimals=[],signedIn=false;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dateKey=(y,m,d)=>`${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
function birthdayOn(a,y,m,d){if(!a.birthMonth||!a.birthDay)return false;let bm=Number(a.birthMonth),bd=Number(a.birthDay);return bm===m&&bd===d;}
function ageOn(a,year){if(!a.birthYear)return null;return year-Number(a.birthYear);}
function drawCalendar(){const year=calendarDate.getFullYear(),month=calendarDate.getMonth()+1; $('calendarTitle').textContent=`${year}年 ${month}月 ♡`;const grid=document.createElement('div');grid.className='calendar-grid';['日','月','火','水','木','金','土'].forEach(d=>{const x=document.createElement('div');x.className='weekday';x.textContent=d;grid.appendChild(x)});for(let i=0;i<new Date(year,month-1,1).getDay();i++)grid.appendChild(document.createElement('div'));const days=new Date(year,month,0).getDate();for(let d=1;d<=days;d++){const key=dateKey(year,month,d),visit=currentRecords.some(r=>r.date===key),birthday=currentAnimals.some(a=>birthdayOn(a,year,month,d));const btn=document.createElement('button');btn.type='button';btn.className='day'+(visit&&birthday?' both':visit?' visit':birthday?' birthday':'')+(selectedDate===key?' selected':'');btn.setAttribute('aria-label',`${month}月${d}日${visit?' 訪問記録あり':''}${birthday?' 誕生日あり':''}`);const n=document.createElement('span');n.textContent=d;btn.appendChild(n);const hearts=document.createElement('span');hearts.className='hearts';if(visit){const h=document.createElement('span');h.className='heart-sea';h.textContent='♥';hearts.appendChild(h)}if(birthday){const h=document.createElement('span');h.className='heart-pink';h.textContent='♥';hearts.appendChild(h)}btn.appendChild(hearts);btn.onclick=()=>{selectedDate=key;drawCalendar();showDay()};grid.appendChild(btn)}$('calendar').replaceChildren(grid)}
function recordElement(r){const wrap=document.createElement('div');wrap.className='record';wrap.innerHTML=`<div class="name">🏝️ ${esc(r.aquarium)}</div><div class="small">${esc(r.date||'日付なし')} ・ ${esc(r.animalCategory||'🦦 ラッコ')}${r.otterName?' ・ '+esc(r.otterName):''}</div>${r.memo?`<p>${esc(r.memo)}</p>`:''}${r.photoOtterName?`<p class="small">📸 ${esc(r.photoOtterName)}</p>`:''}<div class="record-actions"><button class="secondary edit">✏️ 編集</button><button class="danger delete">削除</button></div>`;if(r.photo&&/^data:image\/(jpeg|png|webp);base64,/.test(r.photo)){const img=document.createElement('img');img.src=r.photo;img.alt='思い出の写真';wrap.querySelector('.record-actions').before(img)}wrap.querySelector('.edit').onclick=()=>openRecordEditor(r);wrap.querySelector('.delete').onclick=()=>deleteRecord(r);return wrap}
function showRecords(records,target){const el=$(target);el.replaceChildren();if(!records.length){el.innerHTML='<div class="empty">まだ記録がないよ 🦦🫧</div>';return}records.forEach(r=>el.appendChild(recordElement(r)))}
function showDay(){const el=$('dayDetails');el.replaceChildren();if(!selectedDate)return;const [year,month,day]=selectedDate.split('-').map(Number),birthdays=currentAnimals.filter(a=>birthdayOn(a,year,month,day));const h=document.createElement('h3');h.textContent=`🐚 ${month}月${day}日の思い出`;el.appendChild(h);birthdays.forEach(a=>{const div=document.createElement('div');div.className='birthday-item';const age=ageOn(a,year);div.innerHTML=`🎂 <strong>${esc(a.name)}</strong> お誕生日おめでとう♡ ${age!==null&&age>=0?`<br>${age}歳のお誕生日！`:''}`;el.appendChild(div)});const records=currentRecords.filter(r=>r.date===selectedDate);const list=document.createElement('div');el.appendChild(list);if(records.length)records.forEach(r=>list.appendChild(recordElement(r)));else if(!birthdays.length)list.innerHTML='<div class="empty">この日の記録はまだないよ 🫧</div>'}
function refreshUI(){drawCalendar();renderAnimals();showDay();showRecords(selectedDate?currentRecords.filter(r=>r.date===selectedDate):currentRecords,'records')}
function modal(content){const bg=document.createElement('div');bg.className='modal';const panel=document.createElement('div');panel.className='modal-panel';panel.innerHTML=content;bg.appendChild(panel);document.body.appendChild(bg);bg.addEventListener('click',e=>{if(e.target===bg)bg.remove()});return {bg,panel,close:()=>bg.remove()}}
function compressImage(file){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onerror=()=>reject(Error('写真を読み込めません'));reader.onload=()=>{const img=new Image();img.onerror=()=>reject(Error('画像を開けません'));img.onload=()=>{let w=img.width,h=img.height,max=1000;if(w>h&&w>max){h=Math.round(h*max/w);w=max}else if(h>max){w=Math.round(w*max/h);h=max}const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);resolve(canvas.toDataURL('image/jpeg',.7))};img.src=reader.result};reader.readAsDataURL(file)})}
function requireLogin(){if(signedIn)return true;alert('先にGoogleでログインしてね 🦦');return false}
$('recordForm').onsubmit=async e=>{e.preventDefault();if(!requireLogin())return;const btn=$('saveRecord');btn.disabled=true;try{const f=$('photo').files[0],photo=f?await compressImage(f):'';await window.saveRecordToFirestore({aquarium:$('aquarium').value.trim(),date:$('date').value,animalCategory:$('animalCategory').value,otterName:$('otterName').value.trim(),memo:$('memo').value.trim(),photo,photoOtterName:$('photoOtterName').value.trim()});$('recordForm').reset();selectedDate=null;await reload();alert('思い出を保存したよ 🦦🩵')}catch(err){console.error(err);alert('保存できませんでした: '+err.message)}finally{btn.disabled=false}};
async function deleteRecord(r){if(!requireLogin()||!confirm('この思い出を削除する？'))return;try{await window.deleteRecordFromFirestore(r.id);await reload()}catch(e){alert('削除できませんでした: '+e.message)}}
function openRecordEditor(r){const m=modal(`<h2>✏️ 思い出を編集</h2><label>水族館名</label><input id="editAquarium" required value="${esc(r.aquarium)}"><label>訪問日</label><input id="editDate" type="date" value="${esc(r.date||'')}"><label>動物</label><select id="editCategory">${$('animalCategory').innerHTML}</select><label>個体名</label><input id="editName" value="${esc(r.otterName||'')}"><label>写真</label><div id="editPreview"></div><input id="editPhoto" type="file" accept="image/*"><button class="secondary wide" id="removePhoto">写真を削除</button><label>写真の動物名</label><input id="editPhotoName" value="${esc(r.photoOtterName||'')}"><label>感想</label><textarea id="editMemo">${esc(r.memo||'')}</textarea><div class="modal-actions"><button id="saveEdit">保存する</button><button id="cancelEdit" class="secondary">キャンセル</button></div>`);const q=s=>m.panel.querySelector(s);q('#editCategory').value=r.animalCategory||'🦦 ラッコ';let photo=r.photo||'';function preview(){q('#editPreview').replaceChildren();if(photo){const img=document.createElement('img');img.className='photo-preview';img.src=photo;q('#editPreview').appendChild(img)}else q('#editPreview').textContent='写真なし'}preview();q('#editPhoto').onchange=async()=>{const f=q('#editPhoto').files[0];if(f)try{photo=await compressImage(f);preview()}catch(e){alert(e.message)}};q('#removePhoto').onclick=()=>{photo='';q('#editPhoto').value='';preview()};q('#cancelEdit').onclick=m.close;q('#saveEdit').onclick=async()=>{if(!q('#editAquarium').value.trim())return alert('水族館名を入れてね');q('#saveEdit').disabled=true;try{await window.updateRecordInFirestore(r.id,{aquarium:q('#editAquarium').value.trim(),date:q('#editDate').value,animalCategory:q('#editCategory').value,otterName:q('#editName').value.trim(),photo,photoOtterName:q('#editPhotoName').value.trim(),memo:q('#editMemo').value.trim()});m.close();await reload()}catch(e){alert('更新できませんでした: '+e.message);q('#saveEdit').disabled=false}}}
function renderAnimals(){const el=$('animalProfiles');el.replaceChildren();if(!currentAnimals.length){el.innerHTML='<p class="hint">まだプロフィールがないよ。最初の推しを登録しよう 🦦</p>';return}currentAnimals.forEach(a=>{const div=document.createElement('div');div.className='animal-card';div.innerHTML=`<strong>🫧 ${esc(a.name)}</strong><div class="small">${esc(a.category||'🐾 その他')} ・ ${a.birthMonth&&a.birthDay?`${a.birthMonth}月${a.birthDay}日`:'誕生日未登録'}${a.birthYear?`（${a.birthYear}年生まれ）`:''}</div><div class="actions"><button class="secondary edit">✏️ 編集</button><button class="danger delete">削除</button></div>`;div.querySelector('.edit').onclick=()=>openAnimalEditor(a);div.querySelector('.delete').onclick=async()=>{if(!confirm(`${a.name}のプロフィールを削除する？`))return;try{await window.deleteAnimalFromFirestore(a.id);await reload()}catch(e){alert(e.message)}};el.appendChild(div)})}
function openAnimalEditor(a=null){if(!requireLogin())return;const m=modal(`<h2>🐚 推しのプロフィール ${a?'編集':'登録'}</h2><label>名前</label><input id="animalName" placeholder="例：メイちゃん" value="${esc(a?.name||'')}"><label>動物の種類</label><select id="profileCategory">${$('animalCategory').innerHTML}</select><label>生まれた年（分からなければ空欄）</label><input id="birthYear" type="number" min="1800" max="2100" placeholder="例：2004" value="${esc(a?.birthYear||'')}"><label>誕生月</label><input id="birthMonth" type="number" min="1" max="12" placeholder="例：5" value="${esc(a?.birthMonth||'')}"><label>誕生日</label><input id="birthDay" type="number" min="1" max="31" placeholder="例：9" value="${esc(a?.birthDay||'')}"><p class="hint">2月29日生まれは、うるう年のみ29日に表示します。</p><div class="modal-actions"><button id="saveAnimal">保存する 🩷</button><button class="secondary" id="cancelAnimal">キャンセル</button></div>`);const q=s=>m.panel.querySelector(s);q('#profileCategory').value=a?.category||'🦦 ラッコ';q('#cancelAnimal').onclick=m.close;q('#saveAnimal').onclick=async()=>{const name=q('#animalName').value.trim(),year=q('#birthYear').value,month=q('#birthMonth').value,day=q('#birthDay').value;if(!name)return alert('名前を入力してね');if(Boolean(month)!==Boolean(day))return alert('誕生月と誕生日は両方入力してね');if(year&&!month)return alert('生まれた年を入れる場合は月日も入力してね');if(month){const testYear=year?Number(year):2000;const valid=new Date(testYear,Number(month)-1,Number(day));if(valid.getFullYear()!==testYear||valid.getMonth()+1!==Number(month)||valid.getDate()!==Number(day))return alert('正しい誕生日を入力してね')}q('#saveAnimal').disabled=true;try{const data={name,category:q('#profileCategory').value,birthYear:year?Number(year):null,birthMonth:month?Number(month):null,birthDay:day?Number(day):null};if(a)await window.updateAnimalInFirestore(a.id,data);else await window.saveAnimalToFirestore(data);m.close();await reload()}catch(e){alert('プロフィールを保存できませんでした: '+e.message);q('#saveAnimal').disabled=false}}}
$('addAnimalBtn').onclick=()=>openAnimalEditor();$('prevMonth').onclick=()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()-1,1);selectedDate=null;refreshUI()};$('nextMonth').onclick=()=>{calendarDate=new Date(calendarDate.getFullYear(),calendarDate.getMonth()+1,1);selectedDate=null;refreshUI()};$('showAllRecords').onclick=()=>{selectedDate=null;refreshUI();$('records').scrollIntoView({behavior:'smooth',block:'start'})};$('testCloud').onclick=async()=>{if(!requireLogin())return;try{await reload();alert(`☁️ 思い出 ${currentRecords.length}件、推し ${currentAnimals.length}件を見つけたよ 🦦`)}catch(e){alert(e.message)}};
async function reload(){if(!signedIn)return;const [records,animals]=await Promise.all([window.loadRecordsFromFirestore(),window.loadAnimalsFromFirestore()]);currentRecords=records;currentAnimals=animals;refreshUI()}
refreshUI();
if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.warn));
</script>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-app.js';
import{getFirestore,collection,addDoc,getDocs,deleteDoc,doc,updateDoc,query,orderBy,serverTimestamp}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-firestore.js';
import{getAuth,GoogleAuthProvider,signInWithPopup,signInWithRedirect,getRedirectResult,onAuthStateChanged,signOut}from'https://www.gstatic.com/firebasejs/12.4.0/firebase-auth.js';
const firebaseConfig={apiKey:'AIzaSyBF2zPqr0Yrz9IMckI0paJdjSWkwLGWigA',authDomain:'aquarium-oshikatsu.firebaseapp.com',projectId:'aquarium-oshikatsu',storageBucket:'aquarium-oshikatsu.firebasestorage.app',messagingSenderId:'54021392245',appId:'1:54021392245:web:2ce5f231627bf2e30c753c',measurementId:'G-YMSL9R0C2C'};
const app=initializeApp(firebaseConfig),db=getFirestore(app),auth=getAuth(app),provider=new GoogleAuthProvider();
// Existing records path intentionally unchanged to preserve prior data.
const records=collection(db,'records'),animals=collection(db,'animals');
window.saveRecordToFirestore=async r=>addDoc(records,{...r,createdAt:serverTimestamp()});
window.loadRecordsFromFirestore=async()=>{const s=await getDocs(query(records,orderBy('createdAt','desc')));return s.docs.map(x=>({id:x.id,...x.data()}))};
window.deleteRecordFromFirestore=async id=>deleteDoc(doc(db,'records',id));
window.updateRecordInFirestore=async(id,r)=>updateDoc(doc(db,'records',id),r);
window.saveAnimalToFirestore=async a=>addDoc(animals,{...a,createdAt:serverTimestamp()});
window.loadAnimalsFromFirestore=async()=>{const s=await getDocs(animals);return s.docs.map(x=>({id:x.id,...x.data()}))};
window.updateAnimalInFirestore=async(id,a)=>updateDoc(doc(db,'animals',id),a);
window.deleteAnimalFromFirestore=async id=>deleteDoc(doc(db,'animals',id));
$('loginBtn').onclick=async()=>{try{await signInWithPopup(auth,provider)}catch(e){if(['auth/popup-blocked','auth/operation-not-supported-in-this-environment'].includes(e.code)){await signInWithRedirect(auth,provider)}else alert('ログインできませんでした: '+e.message)}};
getRedirectResult(auth).catch(e=>console.error('Redirect login:',e));
$('logoutBtn').onclick=()=>signOut(auth);
